networks:
  turfbook_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  prometheus_prod_data:
  grafana_prod_data:

services:
  # 🗄️ PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: turfbook_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports: []
    networks:
      - turfbook_network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ⚡ Redis Cache & Lock
  redis:
    image: redis:7-alpine
    container_name: turfbook_redis_prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-turfbook_redis_secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    ports: []
    networks:
      - turfbook_network
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:-turfbook_redis_secret}',
          '--no-auth-warning',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 💻 NestJS Production App
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: turfbook_app_prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      NODE_OPTIONS: '--max-old-space-size=1024'
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?connection_limit=25&pool_timeout=10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD:-turfbook_redis_secret}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-turfbook_redis_secret}
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - turfbook_network
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000/api/health', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ⚖️ Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: turfbook_nginx_prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - turfbook_network

  # 🚀 Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: turfbook_prometheus_prod
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - turfbook_network

  # 📈 Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: turfbook_grafana_prod
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin_secret_prod}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - prometheus
    networks:
      - turfbook_network

