version: '3.8'

networks:
  turfbook_network:
    driver: bridge

services:
  postgres:
    restart: always
    ports: []
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    restart: always
    ports: []
    command: >
      redis-server
      --
