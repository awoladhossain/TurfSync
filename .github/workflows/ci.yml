name: TurfSync CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: turfbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Setup Test Environment Variables
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/turfbook_test?schema=public" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "JWT_SECRET=test-secret-key-for-ci-pipeline-environment-12345" >> $GITHUB_ENV
          echo "JWT_EXPIRES_IN=15m" >> $GITHUB_ENV
          echo "JWT_REFRESH_SECRET=test-refresh-secret-key-for-ci-pipeline-environment-12345" >> $GITHUB_ENV
          echo "JWT_REFRESH_EXPIRES_IN=7d" >> $GITHUB_ENV
          echo "STRIPE_SECRET_KEY=sk_test_mock_key_for_ci_pipeline" >> $GITHUB_ENV
          echo "STRIPE_WEBHOOK_SECRET=whsec_mock_webhook_secret_for_ci_pipeline" >> $GITHUB_ENV
          echo "STRIPE_CURRENCY=usd" >> $GITHUB_ENV

      - name: 🗄️ Generate Prisma Client & Run Migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: 🧪 Run Unit Tests
        run: npm run test

      - name: 🚀 Run End-to-End (E2E) Tests
        run: npm run test:e2e

      - name: 🏗️ Verify Production Build
        run: npm run build
